# Firebase App Hosting Configuration
runConfig:
  # 1 thay vì 0: người dùng đầu tiên sau giờ vắng khách không phải chờ cold start.
  minInstances: 1
  maxInstances: 10

  # PHẢI là 1. Trộn đề là việc CPU-bound (94% thời gian nằm trong exportShuffledXml,
  # là JavaScript đồng bộ) trên một luồng Node duy nhất với cpu: 1 — không có luồng
  # thứ hai để chia. concurrency cao chỉ hợp với web I/O-bound, ở đây nó phản tác dụng:
  # Cloud Run chỉ tạo instance mới khi instance hiện tại VƯỢT ngưỡng này, nên để 20
  # đồng nghĩa 20 người đầu bị dồn vào MỘT instance một vCPU trong khi 9 instance còn
  # lại nằm không — maxInstances trở nên vô dụng.
  #
  # Đo thực tế (24 mã đề, gui/demau_1.docx), mỗi request tốn ~25s CPU:
  #   concurrency 20 → 10 người cùng lúc: ai cũng chờ ~240s, phần lớn timeout
  #   concurrency 1  → 10 người cùng lúc: 10 instance song song, mỗi người ~25s
  concurrency: 1

  cpu: 1
  # RAM không phải nút thắt ở mức 24 mã đề: đo được 227MB cho 1 request.
  memoryMiB: 1024

# Biến môi trường. Thiếu ADMIN_EMAIL là mọi route /api/admin/* trả 403 dù giao
# diện đã hiện tab Quản trị — UI đọc users/{uid}.status, còn requireAdmin chỉ
# chấp nhận custom claim `admin` hoặc email trùng ADMIN_EMAIL.
env:
  - variable: ADMIN_EMAIL
    value: vietthanh228@gmail.com
    availability:
      - RUNTIME

  # PHẢI trùng firebaseConfig.projectId trong gui/index.html, nếu không mọi ID
  # token đều verify thất bại và tài khoản PRO bị hạ xuống 'guest'.
  - variable: FIREBASE_PROJECT_ID
    value: phmix-studio
    availability:
      - RUNTIME

  # CORS ở production khoá theo giá trị này (mặc định https://phmix.com).
  # Bỏ comment và điền domain thật của backend App Hosting sau khi tạo xong.
  # - variable: PUBLIC_URL
  #   value: https://<backend>--phmix-studio.<region>.hosted.app
  #   availability:
  #     - RUNTIME

  # Thông báo đăng ký mới qua Telegram (notifier.ts). Tạo secret trước khi deploy:
  #   firebase apphosting:secrets:set TELEGRAM_BOT_TOKEN --project phmix-studio
  - variable: TELEGRAM_BOT_TOKEN
    secret: TELEGRAM_BOT_TOKEN
    availability:
      - RUNTIME

  # ID phòng chat, không phải credential nên để giá trị thường. Buộc kiểu chuỗi
  # bằng dấu nháy: không có nháy thì YAML đọc thành số âm.
  - variable: TELEGRAM_CHAT_ID
    value: "-5058192283"
    availability:
      - RUNTIME
